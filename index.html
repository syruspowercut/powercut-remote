<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PC Remote">
<meta name="theme-color" content="#0b0b0e">
<title>Powercut Remote</title>
<meta name="referrer" content="no-referrer">
<style>
  :root { --bg:#0b0b0e; --panel:#16161c; --line:#2a2a33; --fg:#f1f1f5; --mut:#9a9aa8; --acc:#ff2a3c; --ok:#2fd36b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system,system-ui,Helvetica,Arial,sans-serif; }
  body { padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px); max-width:560px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  header b { font-size:17px; letter-spacing:.06em; }
  .pill { font-size:12px; padding:4px 9px; border-radius:20px; background:#23232b; color:var(--mut); white-space:nowrap; }
  .pill.ok { background:rgba(47,211,107,.15); color:var(--ok); } .pill.bad { background:rgba(255,42,60,.18); color:#ff7180; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .tabs button, .chip, .big { font:inherit; color:var(--fg); background:#1d1d24; border:1px solid #33333e; border-radius:12px; padding:12px; }
  .tabs button.on, .chip.on { border-color:var(--acc); background:rgba(255,42,60,.15); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--mut); margin:2px 0 8px; }
  textarea, input[type=text] { width:100%; font:inherit; font-size:18px; color:var(--fg); background:#0f0f14; border:1px solid #33333e; border-radius:12px; padding:12px; resize:none; }
  textarea { height:92px; }
  .count { text-align:right; font-size:12px; color:var(--mut); margin-top:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:9px 12px; font-size:14px; }
  .stage { position:relative; width:100%; aspect-ratio:16/9; background:#000 radial-gradient(circle at 50% 50%, #120006 0%, #000 70%); border-radius:10px; overflow:hidden; border:1px solid var(--line); margin-top:10px; }
  .stage .dots { position:absolute; inset:0; background-image:radial-gradient(circle, rgba(236,230,255,.35) 0 1.2px, transparent 1.6px); background-size:6.25% 11.1%; background-position:3.1% 5.5%; }
  .stage .logo { position:absolute; top:7%; left:50%; transform:translateX(-50%); font:800 4.2vw/1 -apple-system,Helvetica; color:#fff; letter-spacing:-.02em; opacity:.9; }
  @media (min-width:560px) { .stage .logo { font-size:23px; } }
  .stage .txt { position:absolute; left:6%; right:6%; top:50%; transform:translateY(-45%); text-align:center; }
  @font-face { font-family:"PC Orbitron"; src:url("fonts/Orbitron-Black.woff2") format("woff2"); font-weight:900; font-display:swap; }
  .ovl-text { display:inline-block; font-family:"PC Orbitron","Orbitron","Arial Black",sans-serif; font-weight:900; text-transform:uppercase; letter-spacing:.05em; line-height:1.12; text-wrap:balance;
    background:linear-gradient(180deg,#ffffff 0%,#ffe1e6 38%,#ff5a70 72%,#ff2a46 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 2px rgba(255,60,90,.9)) drop-shadow(0 0 8px rgba(255,30,60,.55)); }
  .pcaret { display:inline-block; width:.09em; height:.86em; margin-left:.06em; vertical-align:-.06em; background:linear-gradient(180deg,#fff,#ff3d58); -webkit-text-fill-color:initial; animation:pcb 1.06s steps(1,end) infinite; }
  @keyframes pcb { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
  .eyebrow { display:block; font:700 .32em/1 -apple-system,Helvetica; letter-spacing:.35em; color:#ff8a98; margin-bottom:.5em; -webkit-text-fill-color:#ff8a98; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row > * { flex:1; }
  .big { font-size:17px; font-weight:700; padding:15px; width:100%; }
  .send { background:var(--acc); border-color:var(--acc); color:#fff; }
  .send:disabled { opacity:.45; }
  #photoPrev { width:100%; border-radius:10px; display:none; margin-top:10px; max-height:46vh; object-fit:contain; background:#000; }
  .file { position:relative; overflow:hidden; text-align:center; }
  .file input { position:absolute; inset:0; opacity:0; font-size:0; }
  .live { font-size:14px; color:var(--mut); }
  .live b { color:var(--fg); }
  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px); transform:translateX(-50%); background:#22222a; border:1px solid #3a3a46; padding:10px 14px; border-radius:12px; font-size:15px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; text-align:center; }
  #toast.show { opacity:1; }
  .clearbar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(env(safe-area-inset-bottom) + 12px); background:linear-gradient(180deg,rgba(11,11,14,0),#0b0b0e 35%); }
  .clearbar button { max-width:528px; margin:0 auto; display:block; background:#2a0d12; border-color:#7a1d2a; color:#ffb3bc; }
  .hidden { display:none; }
  .scn { font:inherit; font-weight:800; letter-spacing:.04em; color:var(--fg); background:#1d1d24; border:1px solid #33333e; border-radius:12px; padding:16px 8px; }
  .scn.on { border-color:var(--acc); background:rgba(255,42,60,.18); }
  .dotb { width:48px; height:48px; border-radius:50%; border:0; padding:0; }
  .recent .chip { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<header><b>POWERCUT REMOTE · ANYWHERE</b><span class="pill" id="conn">connecting</span></header>
<div class="panel live" id="live">On screen now: <b>nothing</b></div>
<div class="tabs" style="grid-template-columns:1fr 1fr 1fr"><button id="tText" class="on">Text</button><button id="tPhoto">Photo</button><button id="tShow">Show</button></div>

<section id="pText">
  <div class="panel">
    <label>Message</label>
    <textarea id="msg" maxlength="140" placeholder="MAKE SOME NOISE" autocapitalize="characters"></textarea>
    <div class="count"><span id="cnt">0</span>/140</div>
    <label style="margin-top:8px">Style</label>
    <div class="chips" id="styles"><button class="chip on" data-style="headline">Headline</button><button class="chip" data-style="shoutout">Shout-out</button></div>
    <div class="stage"><div class="dots"></div><div class="logo">powercut</div><div class="txt"><span class="ovl-text" id="prev"></span></div></div>
  </div>
  <div class="panel recent hidden" id="recentBox"><label>Recent (tap to edit)</label><div class="chips" id="recent"></div></div>
</section>

<section id="pPhoto" class="hidden">
  <div class="panel">
    <div class="row" style="margin-top:0">
      <div class="big file">Take photo<input type="file" accept="image/*" capture="environment" id="cam"></div>
      <div class="big file">Camera roll<input type="file" accept="image/*" id="roll"></div>
    </div>
    <img id="photoPrev" alt="">
    <label style="margin-top:12px">Caption (optional)</label>
    <input type="text" id="cap" maxlength="80" placeholder="e.g. FRONT ROW">
  </div>
</section>

<section id="pShow" class="hidden">
  <div class="panel"><label>DJ on screen</label><div id="scenesBox" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div></div>
  <div class="panel"><label>Dot colour</label><div id="dotBox" style="display:flex;gap:12px;flex-wrap:wrap"></div></div>
  <div class="panel" style="text-align:center"><label style="text-align:left">DJ name colour (drag the wheel, tap the centre for red)</label><div id="hueBox" style="display:inline-block;margin-top:6px"></div></div>
</section>
<div class="panel" id="sendPanel">
  <label>How long</label>
  <div class="chips" id="durs"><button class="chip" data-s="5">5 s</button><button class="chip on" data-s="8">8 s</button><button class="chip" data-s="20">20 s ⚠︎</button><button class="chip" data-s="60">1 min ⚠︎</button><button class="chip" data-s="0">Until cleared ⚠︎</button></div>
  <div class="count" style="text-align:left;margin-top:8px">Short is best. Longer stays ask you to confirm because they cover the DJ name.</div>
  <div class="row"><button class="big send" id="send">Show on screen</button></div>
</div>
<div class="panel hidden" id="againBox"><label>Show again</label><div class="chips" id="again"></div></div>
<div class="clearbar"><button class="big" id="clear">Clear screen</button></div>
<div id="toast"></div>
<script src="hue-dial.js"></script>
<script src="relay.js"></script>
</body>
</html>
